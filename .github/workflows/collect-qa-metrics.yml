# Polls playwright-agentic, backend-agentic and k6-agentic for newly
# completed workflow runs and ingests their JUnit/k6-summary/CTRF artifacts into
# qa-postgres. This is the "always-on" path for a real deployment where
# qa-postgres is a persistently hosted database (not the local
# docker-compose one `make demo` brings up) -- for the local demo, run
# `make ingest` instead. See docs/qa-kpis.md.
#
# Requires two repo secrets:
#   GH_PAT            fine-grained PAT with actions:read + contents:read on
#                      the three sibling repos (the default GITHUB_TOKEN is
#                      scoped only to this repo, not the org's others)
#   QA_POSTGRES_DSN    connection string for a reachable qa-postgres instance
name: Collect QA metrics

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    # `if:` conditions can't reference `secrets` directly (GitHub Actions rejects the whole
    # workflow file at parse time if they do) -- mirror the ones we need into job-level env
    # first and gate on those instead.
    env:
      HAS_QA_POSTGRES_DSN: ${{ secrets.QA_POSTGRES_DSN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ingest recent runs
        if: ${{ env.HAS_QA_POSTGRES_DSN == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          QA_POSTGRES_DSN: ${{ secrets.QA_POSTGRES_DSN }}
        run: python -m qa_collector.run
      - name: Skip (QA_POSTGRES_DSN not configured)
        if: ${{ env.HAS_QA_POSTGRES_DSN == 'false' }}
        run: |
          echo "::notice::QA_POSTGRES_DSN repo secret is not set, so there's no reachable qa-postgres to ingest into -- skipping. This is expected until a real qa-postgres is deployed; see this file's header comment. For local development use 'make demo' or 'make ingest' instead."
