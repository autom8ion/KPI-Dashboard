# Adds a second dashboard provider alongside DevLake's own ("My Dashboard",
# folder '', path /etc/grafana/dashboards -- baked into the image, and
# recursive). This one's path must stay disjoint from that tree -- a
# subdirectory of it is NOT enough, DevLake's provider would still see the
# files and Grafana would treat the resulting duplicate UIDs as a
# provisioning conflict, freezing writes from both providers. See
# docker-compose.yml's grafana service for the mount.
apiVersion: 1

providers:
  - name: qa-kpi-dashboards
    org_id: 1
    folder: "QA Automation"
    type: file
    disableDeletion: false
    editable: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/kpi-dashboards
      foldersFromFilesStructure: false
